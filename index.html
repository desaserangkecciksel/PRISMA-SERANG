    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc; /* Fallback light */
      }
      /* Dark mode body background override handled by tailwind classes in App.tsx */
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes scaleUp {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-scale-up {
        animation: scaleUp 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      /* New Smooth Page Transition Animation */
      @keyframes pageEnter {
        0% { 
          opacity: 0; 
          transform: translateY(15px) scale(0.99); 
          filter: blur(4px);
        }
        100% { 
          opacity: 1; 
          transform: translateY(0) scale(1); 
          filter: blur(0);
        }
      }
      .animate-page-enter {
        animation: pageEnter 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      .dark ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #0f766e; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #0d9488; 
      }
    </style>
